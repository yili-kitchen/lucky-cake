<style>
:root{
  --bg:#fbf5ea; --card:#fffdf8; --ink:#3b2a1e; --muted:#8a7562; --line:#eadfcd;
  --red:#c8372d; --red-d:#a92c23; --caramel:#e08a1e; --cream:#f6e2bd; --ok:#2f8a4f;
  --shadow:0 2px 0 rgba(59,42,30,.06),0 8px 24px rgba(59,42,30,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.55;padding-bottom:110px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{text-align:center;padding:22px 0 8px}
header img{width:132px;height:auto;border-radius:22px;box-shadow:var(--shadow);background:#f7f5f0}
h1{font-size:30px;font-weight:900;margin:12px 0 2px;letter-spacing:.06em;color:var(--red)}
.sub{color:var(--muted);font-size:14px;margin:0}
.status{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:700;background:#eee}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
.status.open{background:#e3f3e8;color:var(--ok)} .status.closed{background:#f6e6e3;color:var(--red)}
.info{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:16px 0;box-shadow:var(--shadow);display:grid;gap:8px;font-size:14.5px}
.info div{display:flex;gap:10px} .info b{flex:0 0 64px;color:var(--muted);font-weight:500}
.note{background:var(--cream);border-radius:12px;padding:8px 12px;font-size:13px;color:#7a4b10}
h2{font-size:19px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--red)}
.prod{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.prod-img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:var(--cream)}
.prod-hd{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prod-hd h3{margin:0;font-size:20px;font-weight:900}
.prod-hd small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.price{color:var(--red);font-weight:900;font-size:22px;white-space:nowrap}
.price span{font-size:13px;font-weight:500}
.flav{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-top:1px dashed var(--line)}
.flav-name{font-size:16px;font-weight:500}
.step{display:flex;align-items:center;gap:4px}
.step button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:20px;line-height:1;color:var(--ink);cursor:pointer}
.step button.plus{background:var(--red);border-color:var(--red);color:#fff}
.step button:disabled{opacity:.35}
.so{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:#9a8b7c;border-radius:6px;padding:1px 6px;vertical-align:2px}
.flav.out .flav-name{color:var(--muted)}
.step output{min-width:30px;text-align:center;font-weight:700;font-size:17px}
.skewer-hd{background:linear-gradient(135deg,#f3c97d,#e9a64a);padding:18px 16px;display:flex;align-items:center;gap:14px}
.skewer-hd img{width:74px;height:74px;border-radius:16px;object-fit:cover;background:#f7f5f0}
.skewer-hd p{margin:0;color:#5a3507;font-size:13.5px}
form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:grid;gap:14px}
label,.field{display:grid;gap:6px;font-size:14px;font-weight:700}
label em{font-style:normal;color:var(--red)}
input,select,textarea{font:inherit;font-weight:400;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--caramel)}
textarea{min-height:72px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:15px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip small{display:block;font-size:11.5px;color:var(--muted)}
.chip.on{border-color:var(--red);background:#fdeeea;color:var(--red-d);font-weight:700}
.chip:disabled{opacity:.35;text-decoration:line-through}
.empty{color:var(--muted);font-size:14px}
.summary{background:var(--bg);border-radius:14px;padding:10px 14px;font-size:14.5px}
.summary div{display:flex;justify-content:space-between;padding:3px 0}
.summary .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:900;font-size:17px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:0}
.bar .t{flex:1;font-size:13px;color:var(--muted)} .bar .t b{display:block;color:var(--ink);font-size:21px;font-weight:900}
.btn{background:var(--red);color:#fff;border:0;border-radius:14px;padding:14px 22px;font:inherit;font-weight:900;font-size:16px;cursor:pointer}
.btn:disabled{background:#cdbcaa}
.err{color:var(--red);font-size:13.5px;min-height:1em;margin:0}
.paused{background:#fdeeea;border:1.5px solid var(--red);color:var(--red-d);border-radius:16px;padding:14px;text-align:center;font-weight:700;margin:16px 0}
.done{display:none;text-align:center;padding:30px 0}
.done .big{font-size:56px}
.done .no{font-size:34px;font-weight:900;color:var(--red);letter-spacing:.05em;margin:6px 0}
.done .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:left;box-shadow:var(--shadow);margin:16px 0}
footer{text-align:center;color:var(--muted);font-size:12px;margin:30px 0}
.demo{background:#fff4d6;color:#7a5a00;font-size:12px;text-align:center;padding:6px}
</style>
</head>

let customImgs = {};
const imgSrc = p => !p.img ? "" : p.img.startsWith("builtin:") ? IMG[p.img.slice(8)]||"" : customImgs[p.id]||"";
const OPEN_DAYS = [0,3,5,6];            // 日、三、五、六
const SLOT_START = 16*60+30, SLOT_END = 19*60+30, SLOT_STEP = 15, LEAD_MIN = 20, MAX_QTY = 30;
const WD = "日一二三四五六";

const cart = {};      // key "croc|鮮奶原味" -> qty
let selDate = null, selTime = null, paused = false, closures = [], extraOpen = [];
const closureOf = iso => closures.find(c=>c.date===iso);
const isOpenDay = (iso,wd) => extraOpen.includes(iso) || OPEN_DAYS.includes(wd);
const $ = s => document.querySelector(s);

/* 台灣時間（不受手機時區影響） */
function tw(){ const d=new Date(Date.now()+8*3600e3); return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),wd:d.getUTCDay(),min:d.getUTCHours()*60+d.getUTCMinutes()}; }
const pad = n => String(n).padStart(2,"0");
const toMin = t => { const [h,m]=t.split(":"); return +h*60 + +m; };
const fmtMin = m => pad(Math.floor(m/60))+":"+pad(m%60);

function renderMenu(){
  const list = MENU.filter(p=>!p.hidden);
  $("#menu").innerHTML = list.length ? list.map(p => { const src=imgSrc(p), allOut=p.flavors.every(f=>f.soldOut); return `
    <div class="prod">
      ${src ? `<img class="prod-img" src="${src}" alt="${esc(p.name)}">`
        : `<div class="skewer-hd"><img src="${IMG.logo}" alt=""><p>${esc(p.desc||"現烤雞蛋糕")}</p></div>`}
      <div class="prod-hd"><h3>${esc(p.name)}${allOut?' <span class="so">今日售完</span>':""}<small>${esc(p.desc)}</small></h3><div class="price">$${p.price}<span>/${esc(p.unit)}</span></div></div>
      ${p.flavors.map((f,fi) => { const k=p.id+"|"+f.name; return `
        <div class="flav ${f.soldOut?"out":""}"><span class="flav-name">${esc(f.name)}${f.soldOut?' <span class="so">售完</span>':""}</span>
          <div class="step"><button type="button" data-k="${esc(k)}" data-d="-1" aria-label="減少" disabled>−</button>
          <output id="q-${p.id}-${fi}">0</output>
          <button type="button" class="plus" data-k="${esc(k)}" data-d="1" aria-label="增加" ${f.soldOut?"disabled":""}>＋</button></div></div>`;}).join("")}
    </div>`;}).join("") : `<p class="empty">菜單更新中，請稍後再來 🙏</p>`;
}
function bindMenu(){
  $("#menu").addEventListener("click", e => {
    const b = e.target.closest("button[data-k]"); if(!b) return;
    const k=b.dataset.k, q=Math.max(0,Math.min(MAX_QTY,(cart[k]||0)+ +b.dataset.d));
    if(q) cart[k]=q; else delete cart[k];
    update();
  });
}

function items(){
  return Object.entries(cart).map(([k,qty])=>{ const i=k.indexOf("|"), pid=k.slice(0,i), flavor=k.slice(i+1); const p=MENU.find(x=>x.id===pid);
    return p ? {pid,name:p.name,flavor,qty,price:p.price,unit:p.unit,sub:qty*p.price} : null; }).filter(Boolean);
}

function update(){
  const it = items();
  MENU.forEach(p=>p.flavors.forEach((f,fi)=>{ const k=p.id+"|"+f.name; const o=document.getElementById("q-"+p.id+"-"+fi);
    if(o){ o.textContent=cart[k]||0; o.previousElementSibling.disabled=!cart[k]; } }));
  const cnt = it.reduce((a,b)=>a+b.qty,0), tot = it.reduce((a,b)=>a+b.sub,0);
  $("#cnt").textContent=cnt; $("#tot").textContent="$"+tot;
  $("#summary").innerHTML = it.length ? it.map(i=>`<div><span>${i.name}・${i.flavor} × ${i.qty}</span><span>$${i.sub}</span></div>`).join("")
     + `<div class="tot"><span>合計</span><span>$${tot}</span></div>` : `<span class="empty">尚未選擇品項</span>`;
  $("#submit").disabled = !cnt;
}

function renderDates(){
  const now = tw(); const out=[];
  for(let i=0;i<21 && out.length<6;i++){
    const d = new Date(Date.UTC(now.y,now.m-1,now.d+i)); const wd=d.getUTCDay();
    const iso = d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());
    if(!isOpenDay(iso,wd)) continue;
    const c = closureOf(iso); const end = c&&c.from ? toMin(c.from)-SLOT_STEP : SLOT_END;
    if(c && !c.from) continue;
    if(end < SLOT_START) continue;
    if(i===0 && (now.min+LEAD_MIN > end || paused)) continue;
    out.push({iso, label:(d.getUTCMonth()+1)+"/"+d.getUTCDate(), sub:(i===0?"今天":i===1?"明天":"週"+WD[wd])+(i<2?"・週"+WD[wd]:"")});
  }
  if(!out.length){ $("#dates").innerHTML='<span class="empty">近期暫無可預訂日期</span>'; return; }
  $("#dates").innerHTML = out.map(o=>`<button type="button" class="chip" data-date="${o.iso}">${o.label}<small>${o.sub}</small></button>`).join("");
  $("#dates").onclick = e => { const b=e.target.closest(".chip"); if(!b) return;
    selDate=b.dataset.date; selTime=null;
    document.querySelectorAll("#dates .chip").forEach(c=>c.classList.toggle("on",c===b)); renderTimes(); };
}

function renderTimes(){
  const now=tw(); const today = selDate === now.y+"-"+pad(now.m)+"-"+pad(now.d);
  const c = closureOf(selDate); const cut = c&&c.from ? toMin(c.from) : 99999;
  let h = c&&c.from ? `<div class="note" style="width:100%">當天 ${c.from} 後休息${c.reason?"（"+esc(c.reason)+"）":""}</div>` : "";
  for(let m=SLOT_START;m<=SLOT_END;m+=SLOT_STEP){
    if(m >= cut) break;
    const dis = today && m < now.min+LEAD_MIN;
    h+=`<button type="button" class="chip" data-t="${fmtMin(m)}" ${dis?"disabled":""}>${fmtMin(m)}</button>`;
  }
  $("#times").innerHTML=h;
  $("#times").onclick = e => { const b=e.target.closest(".chip"); if(!b||b.disabled) return;
    selTime=b.dataset.t; document.querySelectorAll("#times .chip").forEach(c=>c.classList.toggle("on",c===b)); };
}

function renderStatus(){
  const n=tw(); const iso=n.y+"-"+pad(n.m)+"-"+pad(n.d); const c=closureOf(iso);
  const closeAt = c ? (c.from ? toMin(c.from) : 0) : 21*60;
  const openDay = isOpenDay(iso,n.wd);
  const open = openDay && n.min>=16*60 && n.min<closeAt && !paused;
  const el=$("#status"); el.className="status "+(open?"open":"closed");
  el.querySelector("span").textContent = paused ? "今日已售完" : open ? (c&&c.from ? "營業中・今天 "+c.from+" 打烊" : "營業中")
    : openDay && n.min<16*60 && closeAt>16*60 ? "今天 16:00 開賣" : c&&!c.from&&openDay ? "今日公休" : "休息中・可預訂下次營業日";
  $("#pausedBox").hidden = !paused;
  // 公告近期特殊休息 / 加開
  const upcoming = closures.filter(x=>x.date>=iso).sort((a,b)=>a.date<b.date?-1:1).slice(0,5);
  const extras = extraOpen.filter(x=>x>=iso).sort().slice(0,3);
  const fmtD = d => d.slice(5).replace("-","/")+"（週"+WD[new Date(d+"T00:00:00Z").getUTCDay()]+"）";
  const lines = upcoming.map(x=>`🔸 ${fmtD(x.date)} ${x.from? x.from+" 後休息":"公休"}${x.reason?"・"+esc(x.reason):""}`)
     .concat(extras.map(d=>`🎉 ${fmtD(d)} 加開營業`));
  $("#notice").hidden = !lines.length; $("#notice").innerHTML = "<b>📢 特別公告</b><br>"+lines.join("<br>");
}

/* ===== 後端呼叫 ===== */
async function api(body){
  if(!GAS_URL) return demoApi(body);
  const r = await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return r.json();
}
function demoApi(body){
  let db; try{ db=JSON.parse(localStorage.getItem("jx_demo")||"{}"); }catch(e){ db={}; }
  db.orders=db.orders||[]; db.closures=db.closures||[]; db.extraOpen=db.extraOpen||[];
  if(body.action==="config") return {ok:true,paused:db.pausedDate===todayIso(),closures:db.closures,extraOpen:db.extraOpen,menu:db.menu||null,images:db.images||{}};
  if(body.action==="create"){
    const n=db.orders.filter(o=>o.date===body.date).length+1;
    const no=body.date.slice(5).replace("-","")+"-"+String(n).padStart(3,"0");
    const its=body.items.map(i=>{ const p=MENU.find(x=>x.id===i.pid); return {...i,name:p.name,price:p.price,unit:p.unit}; });
    const total=its.reduce((a,i)=>a+i.qty*i.price,0);
    db.orders.push({no,created:new Date().toISOString(),date:body.date,time:body.time,name:body.name,phone:body.phone,note:body.note,items:its,total,status:"待取貨"});
    try{ localStorage.setItem("jx_demo",JSON.stringify(db)); }catch(e){}
    return {ok:true,no,total};
  }
  return {ok:false,error:"unknown"};
}

$("#submit").onclick = async () => {
  const err=$("#err"); err.textContent="";
  const name=$("#name").value.trim(), phone=$("#phone").value.replace(/\D/g,""), note=$("#note").value.trim();
  const it=items();
  const fail = m => { err.textContent=m; $("#form").scrollIntoView({behavior:"smooth",block:"center"}); };
  if(!it.length) return fail("請先選擇品項");
  if(!selDate) return fail("請選擇取貨日期");
  if(!selTime) return fail("請選擇取貨時間");
  if(!name) return fail("請填寫姓名");
  if(!/^09\d{8}$/.test(phone)) return fail("手機格式需為 09 開頭共 10 碼");
  const btn=$("#submit"); btn.disabled=true; btn.textContent="送出中…";
  try{
    const res = await api({action:"create",date:selDate,time:selTime,name,phone,note,items:it.map(i=>({pid:i.pid,flavor:i.flavor,qty:i.qty}))});
    if(!res.ok) throw new Error(res.error||"送出失敗");
    $("#main").style.display="none"; $("#bar").style.display="none"; $("#done").style.display="block";
    $("#doneNo").textContent=res.no;
    $("#doneCard").innerHTML = `<div class="summary" style="background:none;padding:0">
      <div><span>取貨時間</span><b>${selDate.slice(5).replace("-","/")}（週${WD[new Date(selDate+"T00:00:00Z").getUTCDay()]}）${selTime}</b></div>
      <div><span>取貨人</span><span>${esc(name)}・${phone}</span></div>
      ${it.map(i=>`<div><span>${i.name}・${i.flavor} × ${i.qty}</span><span>$${i.sub}</span></div>`).join("")}
      <div class="tot"><span>現場付款</span><span>$${res.total}</span></div></div>`;
    window.scrollTo(0,0);
  }catch(e){ fail(e.message==="Failed to fetch"?"網路連線失敗，請稍後再試":e.message); btn.disabled=false; }
